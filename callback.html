<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Session Injection Proof</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090D16;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .nx-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #111827 0%, #0F172A 100%);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 28px;
            padding: 35px 24px;
            text-align: center;
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.15);
        }
        .nx-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #0EA5E9;
            margin: 0 auto 15px auto;
            object-fit: cover;
        }
        .nx-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .nx-user-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
        .nx-user-email { color: #94A3B8; font-size: 0.85rem; margin-bottom: 25px; word-break: break-all; }
        
        .nx-session-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px;
            font-size: 0.75rem;
            color: #64748B;
            margin-bottom: 25px;
            text-align: right;
        }
        .nx-session-key { color: #0EA5E9; font-weight: bold; }

        .nx-redirect-btn {
            width: 100%;
            background: #0EA5E9;
            color: #FFFFFF;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
    </style>
</head>
<body>

    <div class="nx-card">
        <div class="nx-badge">✓ تم إنشاء الجلسة وتوثيق الحساب بنجاح</div>
        
        <img id="user-avatar" class="nx-avatar" src="https://via.placeholder.com/80" alt="Avatar" />
        <h2 id="user-name" class="nx-user-name">جاري الفحص...</h2>
        <p id="user-email" class="nx-user-email">...</p>

        <div class="nx-session-box">
            <div><span class="nx-session-key">حالة الجلسة:</span> نشطة (Active Session)</div>
            <div><span class="nx-session-key">رمز التوثيق (UID):</span> <span id="user-uid">...</span></div>
            <div><span class="nx-session-key">المحرك Target:</span> Nexus WebView Engine</div>
        </div>

        <button class="nx-redirect-btn" onclick="returnToApp()">
            العودة للتطبيق فوراً 🚀
        </button>
    </div>

    <script>
        let appRedirectUrl = "";

        // فك تشفير توكن JWT المستلم من جوجل دون الحاجة لمكتبات خارجية
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        window.onload = function() {
            // استخراج الـ ID Token من رابط العودة (Hash Fragment)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token');

            if (idToken) {
                const userData = parseJwt(idToken);

                if (userData) {
                    // عرض بيانات المستخدم الحقيقية القادمة من جوجل
                    document.getElementById('user-avatar').src = userData.picture || 'https://via.placeholder.com/80';
                    document.getElementById('user-name').innerText = userData.name || 'مستخدم Nexus';
                    document.getElementById('user-email').innerText = userData.email || 'لا يوجد بريد';
                    document.getElementById('user-uid').innerText = userData.sub.substring(0, 12) + "...";

                    // تجهيز الرابط المخصص لإغلاق Custom Tab وإعادة الجلسة للـ WebView
                    appRedirectUrl = `com.store.app.auth://callback?` +
                        `code=${encodeURIComponent(idToken)}` +
                        `&email=${encodeURIComponent(userData.email || '')}` +
                        `&name=${encodeURIComponent(userData.name || '')}` +
                        `&uid=${encodeURIComponent(userData.sub || '')}`;

                    // تحويل تلقائي بعد 1.5 ثانية لإتاحة الفرصة للمعاينة البصرية
                    setTimeout(() => {
                        returnToApp();
                    }, 1500);
                }
            } else {
                document.getElementById('user-name').innerText = "خطأ في استقبال التوكن";
                document.getElementById('user-email').innerText = "لم يتم العثور على id_token من جوجل.";
            }
        };

        function returnToApp() {
            if (appRedirectUrl) {
                window.location.href = appRedirectUrl;
            } else {
                alert("رابط التحويل غير جاهز!");
            }
        }
    </script>
</body>
</html>
