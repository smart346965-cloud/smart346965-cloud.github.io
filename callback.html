<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Session Injection Proof</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090D16;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .nx-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #111827 0%, #0F172A 100%);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 28px;
            padding: 35px 24px;
            text-align: center;
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.15);
        }
        .nx-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .nx-user-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
        .nx-user-email { color: #94A3B8; font-size: 0.85rem; margin-bottom: 25px; word-break: break-all; }
        .nx-redirect-btn {
            width: 100%;
            background: #0EA5E9;
            color: #FFFFFF;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="nx-card">
        <div class="nx-badge">✓ جاري تثبيت الجلسة والتحويل...</div>
        <h2 id="user-name" class="nx-user-name">جاري الفحص...</h2>
        <p id="user-email" class="nx-user-email">...</p>
        <button class="nx-redirect-btn" onclick="returnToApp()">العودة للتطبيق فوراً 🚀</button>
    </div>

    <script>
        let appRedirectUrl = "";

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token');

            if (idToken) {
                const userData = parseJwt(idToken);

                if (userData) {
                    document.getElementById('user-name').innerText = userData.name || 'مستخدم Nexus';
                    document.getElementById('user-email').innerText = userData.email || '';

                    // 1. زرع الكوكي والـ LocalStorage داخل نطاق المتصفح
                    document.cookie = "nexus_session=" + encodeURIComponent(idToken) + "; path=/; max-age=86400; SameSite=Lax";
                    localStorage.setItem("nexus_user", JSON.stringify(userData));

                    // 2. تجهيز السكيم المخصص لتوجيه التطبيق وإغلاق Custom Tab
                    const mainAppUrl = "https://smart346965-cloud.github.io/";
                    appRedirectUrl = `com.store.app.auth://callback?target=${encodeURIComponent(mainAppUrl)}&code=${encodeURIComponent(idToken)}`;

                    // 3. التوجيه التلقائي خلال ثانية واحدة
                    setTimeout(() => {
                        returnToApp();
                    }, 1000);
                }
            } else {
                document.getElementById('user-name').innerText = "خطأ في استقبال التوكن من جوجل";
            }
        };

        function returnToApp() {
            if (appRedirectUrl) {
                window.location.href = appRedirectUrl;
            }
        }
    </script>
</body>
</html>
