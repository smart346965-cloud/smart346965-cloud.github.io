<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Auth Engine - Google Sign-In Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090D16;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .nx-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #111827 0%, #0F172A 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .nx-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 6px; }
        .nx-dot { color: #0EA5E9; }
        .nx-subtitle { color: #64748B; font-size: 0.85rem; margin-bottom: 35px; }
        .nx-google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #F8FAFC;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .nx-google-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .nx-google-btn svg { width: 22px; height: 22px; }
        .nx-google-btn.logout { border-color: #EF4444; color: #EF4444; }
        .nx-google-btn.logout:hover { background: rgba(239, 68, 68, 0.1); }
        #dashboard-view h2 { color: #10B981; margin-bottom: 10px; }
        #welcome-user { color: #94A3B8; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="nx-card">
        <!-- واجهة تسجيل الدخول -->
        <div id="login-view">
            <h1 class="nx-title">Nexus<span class="nx-dot">.</span></h1>
            <p class="nx-subtitle">بيئة اختبار مصادقة Google المباشرة</p>
            <button class="nx-google-btn" onclick="startGoogleAuth()">
                <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                <span>متابعة باستخدام Google</span>
            </button>
        </div>

        <!-- واجهة لوحة التحكم (تظهر فقط عند وجود الجلسة) -->
        <div id="dashboard-view" style="display: none;">
            <h2>🎉 مرحباً بك (الجلسة نشطة)</h2>
            <p id="welcome-user"></p>
            <button class="nx-google-btn logout" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        const CLIENT_ID = "142331357333-gm77m2j5so428n1q3ilqnaaehr692pp1.apps.googleusercontent.com"; 
        const REDIRECT_URI = "https://smart346965-cloud.github.io/callback.html";

        function startGoogleAuth() {
            const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
                `client_id=${encodeURIComponent(CLIENT_ID)}` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&response_type=id_token%20token` +
                `&scope=openid%20email%20profile` +
                `&nonce=nexus_${Math.random().toString(36).substring(7)}` +
                `&prompt=select_account`;

            window.location.href = googleAuthUrl;
        }

        // فحص وجود الجلسة/الكوكي أو التوكن القادم من الأندرويد عند تحميل الصفحة
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codeToken = urlParams.get('code') || urlParams.get('id_token');

            // إذا أتى التوكن محمولاً مع رابط العودة من الأندرويد، نثبت الجلسة فوراً داخل الـ WebView
            if (codeToken) {
                document.cookie = "nexus_session=" + encodeURIComponent(codeToken) + "; path=/; max-age=86400; SameSite=Lax";
            }

            const hasCookie = document.cookie.includes("nexus_session=");
            const userData = localStorage.getItem("nexus_user");

            if (hasCookie || userData || codeToken) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
                const user = userData ? JSON.parse(userData) : null;
                document.getElementById('welcome-user').innerText = user ? user.name : "🎉 تم إنشاء الجلسة بنجاح داخل الـ WebView!";
            }
        };

        function logout() {
            document.cookie = "nexus_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            localStorage.removeItem("nexus_user");
            window.location.href = "https://smart346965-cloud.github.io/";
        }
    </script>
</body>
            </html>
